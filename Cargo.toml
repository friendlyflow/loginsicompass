[package]
# Shipped as a Nix package, through desicompass's NixOS module, and as a .deb and
# an .rpm (see below), never through crates.io.
publish = false
name = "loginsicompass"
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-only"
description = "The accessible greetd login screen for sicompass"
repository = "https://github.com/friendlyflow/loginsicompass"

[[bin]]
name = "loginsicompass"
path = "src/main.rs"

# ---------------------------------------------------------------------------
# Linux packages, built by scripts/release-package.sh. See docs/releasing.md.
# ---------------------------------------------------------------------------
#
# Two lists of the same files, because cargo-deb and cargo-generate-rpm each
# want their own. tests/packaging.rs fails when they disagree. The fonts are
# inside the binary, so their licenses ship with it, and the glob picks up a font
# the renderer adds.
#
# Several libraries are dlopened, so they show up as no ELF dependency, no scan
# finds them, and each has to be declared here: the renderer dlopens the Vulkan
# loader, and SDL3 dlopens libwayland-client, -egl and -cursor. No desktop lacks
# them, so scripts/check-install.sh runs the greeter in a bare container.
# Everything else the binary links is found by `$auto` (dpkg-shlibdeps) and by
# packaging/rpm-find-requires.
#
# at-spi2-core is what accesskit_unix talks to over D-Bus: without it the login
# screen is silent to Orca, which here is a complete failure. desicompass is the
# compositor the greeter runs in. Orca is recommended rather than required, so a
# minimal install still has a way in.
[package.metadata.deb]
name = "loginsicompass"
maintainer = "Nico Verrijdt <nico@friendlyflow.com>"
copyright = "Nico Verrijdt <nico@friendlyflow.com>"
section = "x11"
priority = "optional"
# Upstream's own package, so there is no Debian revision to add to the version.
revision = ""
depends = "$auto, greetd, desicompass, dbus, at-spi2-core, libwayland-client0, libwayland-egl1, libwayland-cursor0, libvulkan1, mesa-vulkan-drivers | vulkan-icd"
recommends = "orca"
maintainer-scripts = "packaging/scripts/"
assets = [
    ["target/release/loginsicompass", "usr/bin/loginsicompass", "755"],
    ["packaging/loginsicompass-session", "usr/bin/loginsicompass-session", "755"],
    ["README.md", "usr/share/doc/loginsicompass/README.md", "644"],
    ["LICENSE", "usr/share/doc/loginsicompass/LICENSE", "644"],
    ["THIRD-PARTY-LICENSES.html", "usr/share/doc/loginsicompass/THIRD-PARTY-LICENSES.html", "644"],
    ["fonts/LICENSE-*.txt", "usr/share/doc/loginsicompass/", "644"],
]

# Run from the repo root: `source` is relative to the working directory. Sonames
# and file paths rather than package names where the name is not the same on
# Fedora and openSUSE.
[package.metadata.generate-rpm]
summary = "The accessible greetd login screen for sicompass"
license = "GPL-3.0-only"
url = "https://github.com/friendlyflow/loginsicompass"
post_install_script = "packaging/scripts/postinst"
requires = { greetd = "*", desicompass = "*", "/usr/bin/dbus-run-session" = "*", at-spi2-core = "*", "libwayland-client.so.0()(64bit)" = "*", "libwayland-egl.so.1()(64bit)" = "*", "libwayland-cursor.so.0()(64bit)" = "*", "libvulkan.so.1()(64bit)" = "*" }
recommends = { mesa-vulkan-drivers = "*", orca = "*" }
assets = [
    { source = "target/release/loginsicompass", dest = "/usr/bin/loginsicompass", mode = "755" },
    { source = "packaging/loginsicompass-session", dest = "/usr/bin/loginsicompass-session", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/loginsicompass/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/loginsicompass/LICENSE", mode = "644" },
    { source = "THIRD-PARTY-LICENSES.html", dest = "/usr/share/doc/loginsicompass/THIRD-PARTY-LICENSES.html", mode = "644" },
    { source = "fonts/LICENSE-*.txt", dest = "/usr/share/doc/loginsicompass/", mode = "644" },
]

[features]
# Compile SDL3 from source and link it statically. Only the release packages do
# (scripts/release-package.sh). Off by default, so the dev shell and the Nix
# build link the system one.
bundled-sdl3 = ["sicompass-ui/bundled-sdl3"]

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland client — smithay-client-toolkit 0.21 for XDG shell, shm, seat
smithay-client-toolkit = { version = "0.21", default-features = false, features = [
    "xkbcommon",
] }
wayland-client = "0.31"

# Keyboard
xkeysym = "0.2"

# 2D drawing for framebuffer (no GPU needed)
tiny-skia = "0.11"

# PNG / JPEG background image loading. Same requirement as sicompass-ui's, so
# cargo builds one copy.
image = { version = "0.25", features = ["jpeg", "png", "webp"] }

# greetd IPC: JSON over Unix socket
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# The renderer, and the element model it draws. This is the whole reason the
# greeter looks and speaks like the app: `<radio>`, `<password>`, the insert
# mode and the AccessKit tree are the app's, not a second implementation.
#
# Note what is NOT here: `sicompass`, the application crate. Linking it would
# drag a bundled SQLite, a headless-Chromium driver, an IMAP client
# and an SMTP client into a login screen. See sicompass-ui's Cargo.toml.
#
# Not on crates.io: pinned by git, to a `rev` between releases and to
# `tag = "vX.Y.Z"` at a release. Keep `sicompass-sdk` at the version
# sicompass-ui requires, or cargo builds two copies of it.
sicompass-sdk = "0.9.15"
sicompass-ui = { git = "https://github.com/friendlyflow/sicompass-ui", tag = "v0.2.3" }

# Wiping the password buffer once it has been handed to greetd. See the
# module docs in src/provider.rs for what this does and does not buy.
zeroize = "1"

# `localtime_r`, for the clock's UTC offset.
libc = "0.2"

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# Driving the real renderer headlessly in tests/greeter_ui.rs. `sdl3` comes in
# through sicompass-ui already; this is only for the `Keycode`/`Mod` types the
# key dispatcher takes.
sdl3 = "0.18"

# Local overrides for working on this crate together with a sibling checkout.
#
# MUST STAY COMMENTED ON MAIN. CI and `nix build` check out this repo alone, so
# a path to a sibling that is not there fails at manifest-parse time. Uncomment
# while iterating, and re-comment before committing. Cargo still fetches the
# git source it replaces, so the pinned `rev` has to exist on GitHub.
#
# [patch."https://github.com/friendlyflow/sicompass-ui"]
# sicompass-ui = { path = "../sicompass-ui" }
#
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
